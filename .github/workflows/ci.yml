name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Lint, formatting, tests with coverage thresholds, type check, build and size budget.
      - run: npm run check
      - run: npm run build:demo
      - run: npm audit --audit-level=high
      - name: Check Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$PR_TITLE" | grep -qE '^(feat|fix|perf|refactor|docs|test|build|ci|chore|style)(\([a-z0-9_-]+\))?!?: .+'; then
            echo "PR title must follow Conventional Commits (see CONTRIBUTING.md): $PR_TITLE" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: live-energy-card
          path: dist/live-energy-card.js
          retention-days: 7
